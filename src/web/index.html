<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WISP</title><link rel="stylesheet" href="/style.css"><script src="/locale.js" defer></script><script src="/app.js" defer></script></head>
<body><main><header><span class="brand">WISP</span><span id="version"></span></header>
<section aria-labelledby="state"><div id="badge" data-i18n="h0">Checking connection</div><h1 id="state" data-i18n="h1">Connecting to the router…</h1><p id="detail" data-i18n="h2">Please wait a few seconds.</p><dl><div><dt data-i18n="h3">Router</dt><dd>Xiaomi BE6500 · RN02</dd></div><div><dt data-i18n="h4">Local network</dt><dd>192.168.50.1</dd></div><div><dt data-i18n="h5">After reboot</dt><dd id="boot">—</dd></div></dl>
<p id="notice" role="status" aria-live="polite"></p><a id="newlink" hidden href="https://192.168.50.1:8443/" data-i18n="h6">Open the panel after connecting</a>
<div class="actions"><button id="check" hidden data-i18n="h7">Check connection compatibility</button><button id="start" hidden data-i18n="h8">Turn WISP on</button><button id="confirm" hidden data-i18n="h9">Connection works — save</button><button id="reconnect" class="secondary" hidden data-i18n="h10">Reconnect all Wi-Fi clients</button><button id="rollback" class="secondary" hidden data-i18n="h11">Turn WISP off</button><button id="retry" class="secondary" hidden data-i18n="h12">Retry</button></div><div class="remove"><button id="uninstall" class="danger" disabled data-i18n="h13">Remove WISP completely</button></div></section>
<footer><span data-i18n="h14">Sign in with root and the current SSH password. To sign out, close all browser windows using this panel.</span></footer>
</main></body></html>
