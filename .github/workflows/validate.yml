name: Validate
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/test_runtime.py
      - run: python tests/test_panel.py
      - run: python tests/test_service.py
      - run: python tests/test_clients.py
      - run: python tests/test_remove.py
      - run: python tools/build.py
      - run: python tests/test_installer.py
      - run: python tests/test_removal_package.py
      - run: pip install -r tests/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y nginx
      - run: python tests/test_auth.py
      - run: python tests/test_ui.py
      - run: python tools/finalize.py
      - run: python tools/checksums.py
